# ===================================================================
# ✈️ FLY.IO DEPLOYMENT CONFIG
# ===================================================================
# Alternative to Railway for backend deployment
# Fly.io provides better free tier without sleep issues
# ===================================================================

app = "invoice-air-backend"
primary_region = "sin" # Singapore (gần Việt Nam nhất)

[build]

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"  # Không tự động sleep
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"  # 256MB RAM (free tier)
  memory = "256mb"
  cpus = 1

# Health check
[[services.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api"

# Resource limits
[deploy]
  strategy = "immediate"
