# ===================================================================
# 🎨 RENDER BLUEPRINT — Backend (Docker)
# ===================================================================
# Hướng dẫn chi tiết: docs/RENDER_DEPLOYMENT.md
# Environment variables: docs/RENDER_ENV_VARIABLES.txt
#
# Cách deploy:
#   1. Push file này lên branch `develop`
#   2. Render Dashboard → New → Blueprint → chọn repo → Apply
#   3. Render sẽ hỏi các biến có `sync: false`
#
# ⚠️ Production deploy từ branch `develop` (main chỉ là nhánh lưu trữ)
#
# ⚠️ LƯU Ý:
#   - KHÔNG dùng Free plan - Chromium sẽ crash
#   - Phải dùng Starter plan ($7/mo) để chạy ổn định
# ===================================================================

services:
  - type: web
    name: invoice-air-backend
    runtime: docker

    # Repository configuration
    branch: develop
    region: singapore
    
    # ⚠️ QUAN TRỌNG: Phải dùng Starter plan
    # Free plan: 512MB RAM + Sleep = Chromium crash
    # Starter plan: 512MB RAM + No sleep = Chạy ổn định
    plan: starter

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Auto deploy khi push code
    autoDeploy: true

    # Health check endpoint
    healthCheckPath: /api

    envVars:
      # Server Configuration
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: "Asia/Ho_Chi_Minh"

      # Database - Supabase PostgreSQL
      - key: DATABASE_URL
        sync: false

      # JWT Authentication
      # Render tự generate random secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"

      # Frontend URLs - Update sau khi deploy Vercel
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"

      # PDF/Chromium Optimization
      - key: PDF_BROWSER_IDLE_TIMEOUT_MS
        value: "60000"
      - key: PDF_RENDER_TIMEOUT_MS
        value: "30000"

      # SMTP Email (Optional) - Chỉ hoạt động với Starter plan
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
